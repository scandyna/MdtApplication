
include:
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_NoArch@0.0.13
    inputs:
      components:
        - 'mdtcommandlinearguments'
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_Ubuntu-18-04_gcc8_x86_64@0.0.13
    inputs:
      job_name_suffix: '_Tier1'
      components:
        - 'mdtconsoleapplication'
      build_types:
        - 'Debug'
        - 'Release'
      shared_libs:
        - 'True'
        - 'False'
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_Ubuntu-18-04_gcc8_x86_64@0.0.13
    inputs:
      job_name_suffix: '_Tier2'
      components:
        - 'mdtcoreapplicationfornonqtusage'
        - 'mdtguiapplicationfornonqtusage'
      build_types:
        - 'Debug'
        - 'Release'
      shared_libs:
        - 'True'
        - 'False'
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_Ubuntu-18-04_clang10_x86_64_libcxx@0.0.13
    inputs:
      job_name_suffix: '_Tier1'
      components:
        - 'mdtconsoleapplication'
      build_types:
        - 'Debug'
        - 'Release'
      shared_libs:
        - 'True'
        - 'False'
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_Ubuntu-18-04_clang10_x86_64_libcxx@0.0.13
    inputs:
      job_name_suffix: '_Tier2'
      components:
        - 'mdtcoreapplicationfornonqtusage'
        - 'mdtguiapplicationfornonqtusage'
      build_types:
        - 'Debug'
        - 'Release'
      shared_libs:
        - 'True'
        - 'False'

Conan_Deploy_Ubuntu-18-04_gcc8_x86_64_Tier2:
  needs:
    - job: Conan_Deploy_NoArch
      artifacts: false

Conan_Deploy_Ubuntu-18-04_clang10_x86_64_libcxx_Tier2:
  needs:
    - job: Conan_Deploy_NoArch
      artifacts: false


